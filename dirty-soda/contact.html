<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="author" content="Aby Blum Sudds">
    <meta name="description" content="Contact me about dirty sodas">
    <meta name="keywords" content="dirty soda, contact">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Me About Dirty Sodas</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <header>
        <div class="container title">
            <img src="images/Dirty_Soda.png" alt="Orange dirty soda illustration" class="soda">
            <h2>Dirty Soda Lab</h2>
            <img src="images/Dirty_Soda.png" alt="Orange dirty soda illustration" class="soda">
        </div>
        <nav class="navbar">
            <input type="checkbox" id="checkbox-toggle">
            <label for="checkbox-toggle" class="menu-btn" aria-label="Open navigation menu"></label>
            <ul class="menu">
                <li><a href="index.html">How To</a></li>
                <li><a href="resources.html">Resources</a></li>
                <li><a class="current">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <section class="sec1">
            <h1>Contact Me About Dirty Sodas</h1>
            <p>If you have questions or comments about dirty sodas, just fill out the form below, and I'll get back to
                you as soon as I can!</p>
        </section>

        <section class="sec2">
            <h2>Send a Message</h2>
            <form>
                <div>
                    <label for="name">Your Name:</label>
                    <input type="text" name="name" id="name" placeholder="Cherry Sweetfoam" required>
                </div>

                <div>
                    <label for="email">Email:</label>
                    <input type="email" name="email" id="email" placeholder="cherry@sweetfoam.com" required>
                </div>

                <div>
                    <label for="reason">What brings you to the lab today?</label>
                    <select id="reason" name="reason">
                        <option value="recipe">I have a new recipe idea for you!</option>
                        <option value="feedback">I tried one of your recipes and have thoughts...</option>
                        <option value="hello">Just wanted to say hi!</option>
                    </select>
                </div>

                <div>
                    <label for="message">Message:</label>
                    <textarea name="message" id="message" placeholder="Type your message here!" required></textarea>
                </div>

                <div>
                    <button type="submit">Send</button>
                    <button type="reset">Reset</button>
                </div>
            </form>
        </section>

        <aside class="sec3">
            <img src="images/Orange_Soda2.png" alt="Orange dirty soda with lots of cream illustration">
        </aside>
    </main>

    <footer>
        <p class="container">&copy;2026 | Aby Blum Sudds</p>
    </footer>
</body>

</html>
