            <h2>Questions or Comments?</h2>
            <p>If you have questions or comments about dirty sodas, just fill out the form below, and I'll get back to

                <div>
                    <label for="message">Message:</label>
                    <textarea id="message"></textarea>
                </div>

                <div>
                    <button type="submit">Submit</button>
                    <button type="reset">Reset</button>
                </div>
            </form>
        </section>

        <section class="sec3">
            <img src="images/Orange Soda.png" alt="Orange dirty soda illustration">
